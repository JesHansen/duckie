name: Release
# Run manually from the Actions tab. Builds the latest commit on main, tags it v<workspace version>,
# and publishes the portable ZIP. Bump [workspace.package] version in Cargo.toml before each release.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Resolve version
        id: version
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'duckie-desktop' }).version
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists. Bump the workspace version in Cargo.toml first." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: python scripts/generate-shortcuts.py --check

      - name: Package
        run: .\scripts\package.ps1

      - name: Checksum
        id: package
        run: |
          $zip = "dist/Duckie-${{ steps.version.outputs.version }}-windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Portable Windows x64 build of commit $env:GITHUB_SHA.

          Extract the ZIP and run ``duckie.exe``. Keep ``duckie-test-worker.exe`` beside ``duckie.exe`` and ``duckie-cli.exe``.

          SHA-256: ``${{ steps.package.outputs.sha256 }}``
          "@
          gh release create "${{ steps.version.outputs.tag }}" `
            "${{ steps.package.outputs.zip }}" `
            "${{ steps.package.outputs.zip }}.sha256" `
            --target $env:GITHUB_SHA `
            --title "Duckie ${{ steps.version.outputs.version }}" `
            --notes $notes `
            --generate-notes
