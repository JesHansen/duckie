[package]
name = "duckie-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "duckie"
path = "src/main.rs"

[features]
screenshot = ["dep:image"]
bench = ["dep:windows-sys"]

[dependencies]
duckie-model.workspace = true
duckie-storage.workspace = true
duckie-http.workspace = true
duckie-tests.workspace = true
duckie-openapi.workspace = true
duckie-app.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "accesskit", "default_fonts", "persistence"] }
rfd = "=0.17.2"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"], optional = true }
